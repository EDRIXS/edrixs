name: Docker build and smoke test

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: false
        type: string
        default: ""
      push:
        description: Push a release image to Docker Hub
        required: false
        type: boolean
        default: false
      release_tag:
        description: Existing published GitHub release tag
        required: false
        type: string
        default: ""
      publish_latest:
        description: Also update the latest tag
        required: false
        type: boolean
        default: false
    secrets:
      DOCKERHUB_TOKEN:
        # Test-only callers do not need registry credentials.
        required: false

permissions:
  contents: read

env:
  IMAGE_NAME: edrixs/edrixs

jobs:
  smoke-test:
    name: Build and smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build application image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/Dockerfile
          target: app
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: edrixs:test
          cache-from: type=gha,scope=edrixs-app
          cache-to: type=gha,mode=max,scope=edrixs-app

      - name: Test Python extension
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          docker run --rm --interactive --env RELEASE_TAG edrixs:test python - <<'PY'
          import os
          from importlib.metadata import version

          import numpy
          from edrixs import fedrixs

          actual = version("edrixs")
          expected = os.environ.get("RELEASE_TAG", "").removeprefix("v")
          assert actual != "0+unknown"
          assert not expected or actual == expected, (actual, expected)
          assert int(numpy.__version__.split(".")[0]) >= 2
          print(actual, fedrixs.__file__)
          PY

      - name: Test two-rank MPI execution
        run: |
          docker run --rm edrixs:test mpirun -np 2 python -c \
            "from mpi4py import MPI; from edrixs import fedrixs; print(MPI.COMM_WORLD.rank)"

  publish:
    name: Publish release image
    if: inputs.push
    needs: smoke-test
    runs-on: ubuntu-latest
    environment: dockerhub
    concurrency:
      group: dockerhub-${{ inputs.release_tag }}
      cancel-in-progress: false
    steps:
      - name: Validate release inputs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_TAG}" ]]; then
            echo "release-tag is required when push is true" >&2
            exit 1
          fi
          published_tag="$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            --jq 'select(.draft == false) | .tag_name')"
          if [[ "${published_tag}" != "${RELEASE_TAG}" ]]; then
            echo "${RELEASE_TAG} is not a published GitHub release" >&2
            exit 1
          fi

      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ inputs.release_tag }}
            type=raw,value=latest,enable=${{ inputs.publish_latest }}

      - name: Build and push multi-platform image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/Dockerfile
          target: app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=edrixs-app
          cache-to: type=gha,mode=max,scope=edrixs-app
          provenance: mode=max
          sbom: true

      - name: Verify the published manifest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          manifest="$(docker buildx imagetools inspect "${IMAGE_NAME}@${DIGEST}")"
          grep -q 'Platform: *linux/amd64' <<<"${manifest}"
          grep -q 'Platform: *linux/arm64' <<<"${manifest}"
          printf '%s\n' "${manifest}"

      - name: Check out the current Docker Hub description
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          path: dockerhub-description
          persist-credentials: false
          sparse-checkout: docker/README.md

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          short-description: An open source toolkit for simulating RIXS spectra based on exact diagonalization
          readme-filepath: ./dockerhub-description/docker/README.md
          enable-url-completion: true
