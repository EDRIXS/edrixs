<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 462" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box     { fill: #eef3f8; stroke: #2c5aa0; stroke-width: 1.5; }
    .title   { fill: #12243a; font-size: 15px; font-weight: 700; }
    .sub     { fill: #2c5aa0; font-size: 12px; font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    .anno    { fill: #3c4043; font-size: 11.5px; }
    .code    { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
    .flow    { stroke: #5f6368; stroke-width: 1.6; fill: none; }
    .bracket { stroke: #80868b; stroke-width: 1.3; fill: none; }
    .blabel  { fill: #5f6368; font-size: 11.5px; }
    @media (prefers-color-scheme: dark) {
      .box     { fill: #1e2a38; stroke: #7aa7e0; }
      .title   { fill: #e8eef6; }
      .sub     { fill: #9dc1ec; }
      .anno    { fill: #c2c7cd; }
      .flow    { stroke: #9aa0a6; }
      .bracket { stroke: #9aa0a6; }
      .blabel  { fill: #9aa0a6; }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6368"/>
    </marker>
  </defs>

  <!-- stage boxes -->
  <rect class="box" x="70"  y="10"  width="300" height="76" rx="6"/>
  <text class="title" x="220" y="40"  text-anchor="middle">Physical model</text>
  <text class="sub"   x="220" y="59"  text-anchor="middle">model_1v1c &#183; model_2v1c</text>
  <text class="sub"   x="220" y="75"  text-anchor="middle">model_siam &#183; etc.</text>

  <rect class="box" x="70"  y="132" width="300" height="58" rx="6"/>
  <text class="title" x="220" y="157" text-anchor="middle">Many-body operators</text>
  <text class="sub"   x="220" y="176" text-anchor="middle">build_op &#183; get_ops</text>

  <rect class="box" x="70"  y="244" width="300" height="58" rx="6"/>
  <text class="title" x="220" y="269" text-anchor="middle">Exact diagonalization</text>
  <text class="sub"   x="220" y="288" text-anchor="middle">ed</text>

  <rect class="box" x="70"  y="356" width="300" height="58" rx="6"/>
  <text class="title" x="220" y="381" text-anchor="middle">Spectrum</text>
  <text class="sub"   x="220" y="400" text-anchor="middle">xas &#183; rixs</text>

  <!-- flow arrows -->
  <line class="flow" x1="220" y1="86"  x2="220" y2="130" marker-end="url(#arrow)"/>
  <line class="flow" x1="220" y1="190" x2="220" y2="242" marker-end="url(#arrow)"/>
  <line class="flow" x1="220" y1="302" x2="220" y2="354" marker-end="url(#arrow)"/>
  <line class="flow" x1="220" y1="414" x2="220" y2="452" marker-end="url(#arrow)"/>

  <!-- data passed between stages, beside each arrow -->
  <text class="anno" x="232" y="108">
    <tspan class="code">emat</tspan>, <tspan class="code">umat</tspan>, <tspan class="code">trans_mat</tspan>, Fock-basis spec
  </text>

  <text class="anno" x="232" y="210"><tspan class="code">hmat_i</tspan> (no core hole),</text>
  <text class="anno" x="232" y="225"><tspan class="code">hmat_n</tspan> (core hole), transition operators</text>

  <text class="anno" x="232" y="322">low-energy eigenstates</text>
  <text class="anno" x="232" y="337"><tspan class="code">eval_i</tspan>, <tspan class="code">evec_i</tspan></text>

  <text class="anno" x="232" y="437">XAS / RIXS intensity vs. photon energy</text>

  <!-- backend bracket spanning the numerical stages -->
  <path class="bracket" d="M 60 132 L 52 132 L 52 414 L 60 414"/>
  <text class="blabel" transform="rotate(-90 34 273)" x="34" y="273" text-anchor="middle">backend:  dense &#183; scipy &#183; petsc &#183; etc.</text>
</svg>
